name: Playwright E2E Tests

on:
  push:
    branches:
      - development
      - BQ_tableros_api
      - CCTestBranch
      - CeniaChoquevillca-patch-1
      - FMTestBranch
      - fixCC
  pull_request:
    branches:
      - development
      - BQ_tableros_api
      - CCTestBranch
      - CeniaChoquevillca-patch-1
      - FMTestBranch
      - fixCC
  workflow_dispatch:

jobs:
  tests:
    name: Run ${{ matrix.tag }} (headed)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ['@smoke', '@integration']

    env:
      # Bases (usa secrets si los definiste; si no, caen al default del código)
      UI_BASE: ${{ secrets.UI_BASE || 'https://trello.com' }}
      API_BASE: ${{ secrets.API_BASE || 'https://api.trello.com/1' }}

      # Credenciales Trello (DEBEN estar en Secrets)
      TRELLO_EMAIL:    ${{ secrets.TRELLO_EMAIL }}
      TRELLO_PASSWORD: ${{ secrets.TRELLO_PASSWORD }}
      # Usa el que corresponda en tu helper/services
      TRELLO_API_KEY:  ${{ secrets.TRELLO_API_KEY }}
      TRELLO_KEY:      ${{ secrets.TRELLO_KEY }}
      TRELLO_TOKEN:    ${{ secrets.TRELLO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous reports
        run: rm -rf allure-results allure-report playwright-report || true

      # Ejecuta EN HEADED + filtra por etiqueta de la matriz
      - name: Run Playwright ${{ matrix.tag }} (headed)
        run: |
          xvfb-run -a npx playwright test --headed --grep "${{ matrix.tag }}" --reporter=line,allure-playwright

      # ------ Artefactos Playwright ------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.tag }}
          path: playwright-report
          retention-days: 7

      # ------ Allure ------
      - name: Install Allure CLI
        if: always()
        run: npm i -g allure-commandline

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.tag }}
          path: allure-results
          retention-days: 7

      - name: Generate Allure report
        if: always()
        run: npx allure generate ./allure-results -o ./allure-report --clean

      - name: Upload Allure report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.tag }}
          path: allure-report
          retention-days: 7
