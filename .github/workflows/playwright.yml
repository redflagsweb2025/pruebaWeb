name: Playwright Tests

on:
  push:
    branches:
      - development
      - BQ_tableros_api
      - CCTestBranch
      - CeniaChoquevillca-patch-1
      - FMTestBranch
      - fixCC
      - NefTest
  pull_request:
    branches:
      - development
      - BQ_tableros_api
      - CCTestBranch
      - CeniaChoquevillca-patch-1
      - FMTestBranch
      - fixCC
  workflow_dispatch:

# Variables compartidas (usa secrets si los definiste)
env:
  UI_BASE:         ${{ secrets.UI_BASE }}
  API_BASE:        ${{ secrets.API_BASE }}
  TRELLO_EMAIL:    ${{ secrets.TRELLO_EMAIL }}
  TRELLO_PASSWORD: ${{ secrets.TRELLO_PASSWORD }}
  TRELLO_API_KEY:  ${{ secrets.TRELLO_API_KEY }}
  TRELLO_KEY:      ${{ secrets.TRELLO_KEY }}
  TRELLO_TOKEN:    ${{ secrets.TRELLO_TOKEN }}

jobs:
  all:
    name: Run ALL (headed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous reports
        run: rm -rf allure-results allure-report playwright-report || true

      # (Opcional) Debug: presencia de env/secrets (no imprime valores)
      - name: Debug env presence
        run: |
          node -e "const r=k=>process.env[k]?'OK':'MISSING'; console.log({
            UI_BASE:r('UI_BASE'), API_BASE:r('API_BASE'),
            TRELLO_EMAIL:r('TRELLO_EMAIL'), TRELLO_PASSWORD:r('TRELLO_PASSWORD'),
            TRELLO_TOKEN:r('TRELLO_TOKEN'),
            TRELLO_API_KEY:r('TRELLO_API_KEY'), TRELLO_KEY:r('TRELLO_KEY')
          })"

      - name: Run ALL tests (headed)
        run: |
          xvfb-run -a npx playwright test --headed --reporter=line,allure-playwright

      # --- Playwright HTML report ---
      - name: Upload Playwright HTML report (ALL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ALL
          path: playwright-report
          retention-days: 7

      # --- Allure ---
      - name: Install Allure CLI
        if: always()
        run: npm i -g allure-commandline

      - name: Upload Allure raw results (ALL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ALL
          path: allure-results
          retention-days: 7

      - name: Generate Allure report (ALL)
        if: always()
        run: npx allure generate ./allure-results -o ./allure-report --clean

      - name: Upload Allure report (HTML) (ALL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ALL
          path: allure-report
          retention-days: 7
